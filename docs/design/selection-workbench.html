function renderPipeline(){const scroll=$('pipeline-list').scrollTop,x=$('pipeline-list').scrollLeft;let html='';if(state.layout==='flow')html='<div class="graph-terminal">Input · '+textSummary(state.source)+'</div><div class="graph-arrow">↓</div>';state.steps.forEach((s,i)=>{const result=results.stages[i],active=state.selected===s.uid,inline=active&&state.configOpen&&['workbench','focus'].includes(state.layout);html+='<article class="step '+(active?'active ':'')+(!s.enabled?'disabled ':'')+(result?.error?'step-error':'')+'" draggable="true" data-step-card="'+s.uid+'"><div class="node-row"><button class="node-main" data-select="'+s.uid+'" aria-label="Configure '+(i+1)+'. '+esc(definition(s.id).name)+'" aria-expanded="'+(active&&state.configOpen)+'"><span class="step-num">'+(i+1)+'</span><span class="step-info"><span class="step-name">'+esc(definition(s.id).name)+'</span><span class="step-summary">'+esc(!s.enabled?'Skipped':result?.error||summarize(s))+'</span></span></button><div class="step-actions"><button class="node-menu" data-step-menu="'+s.uid+'" aria-label="More for step '+(i+1)+'">⋯</button><button class="step-remove" data-remove-step="'+s.uid+'" aria-label="Remove step '+(i+1)+'" title="Remove · ⌫"></button></div></div><div class="step-flow">'+esc(result?.error?'Check this action':!s.enabled?'Skipped':textSummary(result?.before||'')+' → '+textSummary(result?.text||''))+'</div>'+(inline?'<div class="inline-config">'+configuration(s)+'</div>':'')+'</article>';if(state.layout==='flow')html+='<div class="graph-arrow">↓<span class="edge-label">'+esc(result?.error?'Needs attention':count(result?.text||''))+'</span></div>';});if(state.layout==='flow')html+='<div class="graph-terminal">Output · '+textSummary(results.text)+'</div>';if(!state.steps.length&&state.layout!=='flow')html='<div class="pipeline-empty">Add a command to start your workflow.</div>';$('pipeline-list').innerHTML=html;$('pipeline-list').scrollTop=scroll;$('pipeline-list').scrollLeft=x;$('pipeline-  document.querySelectorAll('.no-settings').forEach(n=>n.remove());
 document.querySelectorAll('.configuration').forEach(cfg=>{
  const start=cfg.querySelector('[data-setting=start]'),opening=cfg.querySelector('[data-setting=open]'),first=start||opening;
  const second=cfg.querySelector(start?'[data-setting=format]':'[data-setting=close]');
  if(first&&second&&!first.closest('.setting-pair')){const pair=document.createElement('div');pair.className='setting-pair'+(start?' number-pair':'');const a=first.closest('.field'),b=second.closest('.field');a.before(pair);pair.append(a,b);}
 });
}
const EXAMPLE_DESCRIPTIONS={split:'Turn separated items into lines.',join:'Combine lines with a separator.',sort:'Sort lines alphabetically.',unique:'Remove duplicate lines; keep the first.',number:'Number each line in sequence.',prefix:'Add text before each line.',suffix:'Add text after each line.',clean:'Tidy spaces and empty lines.',html:'Remove HTML/XML tags; keep the text.',url:'Remove tracking or decode URL escapes.',surround:'Add, change or remove surrounding pairs.',expand:'Expand escapes, tabs or abbreviations.',replace:'Replace matching text.',upper:'Convert letters to uppercase.',lower:'Convert letters to lowercase.',title:'Capitalize the first letter of each word.'};
function exampleInput(id,o){
 const lines='pear\napple\nbanana';
 if(id==='split')return ['pear','apple','pear'].join((o.separator==='custom'?o.custom:o.separator)||', ');
 if(id==='unique')return 'pear\napple\npear';
 if(['join','sort','number','prefix','suffix'].includes(id))return lines;
 if(id==='clean')return '  pear  \n\n apple   pie ';
 if(id==='html')return '<p>Hello <strong>Magpie</strong> &amp; friends.</p>\n<p><a href="https://example.com">Read more</a></p>';
 if(id==='url')return o.mode==='decode'?'https://example.com/hello%20world':'https://example.com/page?utm_source=mail&keep=yes#part';
 if(id==='surround')return o.mode==='add'?(o.scope==='whole'?'hello world':'pear\napple'):(o.scope==='whole'?'"hello world"':'"pear"\n"apple"');
 if(id==='expand')return o.mode==='tabs'?'pear\tapple':o.mode==='abbreviation'?'Send to '+(o.shortcut||'addr')+'.':'pear\\napple\\tpie';
 if(id==='replace')return (o.find||'pear')+' and apple';
 return 'Hello Magpie';
}
function renderExample(){
 examplePanel.hidden=!state.exampleOpen;
 if(!state.exampleOpen)return;
 const connected=state.steps.find(s=>s.uid===state.exampleUid),action=definition(connected?.id||state.exampleId);
 if(!action){state.exampleOpen=false;examplePanel.hidden=true;return;}
 const s=connected||{id:action.id,options:{...structuredClone(action.defaults),...(action.id==='replace'?{find:'pear',replacement:'banana'}:{})}};
 const floating=!state.picker&&getComputedStyle(document.querySelector('.library')).display==='none';
 const host=state.picker?$('command-picker'):floating?$('app'):document.querySelector('.library');
 if(examplePanel.parentElement!==host)host.append(examplePanel);
 examplePanel.classList.toggle('example-floating',floating);
 const before=exampleInput(action.id,s.options);let after='',error='';try{after=apply(before,s);}catch(e){error=e.message;}
 const index=connected?state.steps.indexOf(connected):-1;
 const needsSplit=action.id==='unique'&&index>=0&&!results.stages[index]?.before.includes('\n')&&results.stages[index]?.before.includes(',')&&state.steps.slice(index+1).some(s=>s.id==='split'&&s.enabled);
 const focus=examplePanel.contains(document.activeElement)?captureFocus():null,scroll=examplePanel.scrollTop;
 examplePanel.innerHTML='<div class="example-top"><h3 class="example-title">'+actionGlyph(action.id)+esc(action.name)+'</h3><button class="icon-button" data-close-example data-focus="example-close" aria-label="Close example" title="Close · esc">'+glyph('close')+'</button></div><p class="example-description">'+EXAMPLE_DESCRIPTIONS[action.id]+'</p><div class="example-meta"><span>'+(connected?'Current settings':'Example')+'</span><span>F1</span></div><span class="example-text-label" id="example-before-label">Before</span><pre tabindex="0" data-focus="example-before" aria-labelledby="example-before-label">'+esc(before)+'</pre><span class="example-text-label" id="example-after-label">After</span><pre tabindex="0" data-focus="example-after" aria-labelledby="example-after-label"'+(error?' hidden':'')+'>'+esc(after)+'</pre>'+(error?'<p class="example-error" role="status">'+esc(error)+'</p>':'')+(needsSplit?'<p class="example-context-hint">For this selection: Split → Unique.</p>':'');
 examplePanel.scrollTop=scroll;restoreFocus(focus);
}
function openExample(id,uid=null){
 state.exampleReturn={key:document.activeElement?.dataset.focus||null,pane:state.lastPane};state.exampleId=id;state.exampleUid=uid;state.exampleOpen=true;
 closeContext();render();examplePanel.querySelector('[data-close-example]').focus({preventScroll:true});
}
function closeExample(){
 const previous=state.exampleReturn;state.exampleOpen=false;examplePanel.hidden=true;
 const node=previous?.key?document.querySelector('[data-focus="'+CSS.escape(previous.key)+'"]'):null;
 if(node&&node.getClientRects().length)node.focus({preventScroll:true});
 else if(state.picker)$('picker-search').focus();
 else if(previous?.pane==='commands')focusPane('commands');else focusNode(state.selected);
 updateFocus();
}
function openRelevantExample(){
 if(state.help||state.saveOpen)return;
 if(examplePanel.contains(document.activeElement)&&state.exampleOpen){closeExample();return;}
 const command=document.activeElement?.closest('[data-add]'),inCommands=!!document.activeElement?.closest('.library');
 if(command){openExample(command.dataset.add);return;}
 if(state.picker||inCommands){const list=state.picker?visiblePicker:visibleCommands,index=state.picker?state.pickerIndex:state.commandIndex,action=list[Math.max(0,index)];if(action)openExample(action.id);return;}
 const s=state.steps.find(s=>s.uid===state.selected);if(s)openExample(s.id,s.uid);
}
// Keep the info affordance separate from Add, for predictable click and key behavior.
const workbenchCommands=commands;
commands=function(query,picker=false){

 temp.content.querySelectorAll('.command').forEach(command=>{const row=document.createElement('div');row.className='command-row';command.replaceWith(row);row.append(command);row.insertAdjacentHTML('beforeend','<button class="command-info" data-command-example="'+command.dataset.add+'" aria-label="Example: '+esc(definition(command.dataset.add).name)+'" title="Example · F1" tabindex="-1">'+glyph('info')+'</button>');});return temp.innerHTML;
};
const focusedRender=render;
render=function(){focusedRender();polishForms();renderExample();updateFocus();};
const focusedNode=focusNode;
focusNode=function(uid,draw=true){if(state.exampleOpen&&!state.picker){const s=state.steps.find(s=>s.uid===uid);if(s){state.exampleId=s.id;state.exampleUid=s.uid;}}focusedNode(uid,draw);if(!draw&&state.exampleOpen)renderExample();updateFocus();};
const focusedCommandMove=commandMove;
commandMove=function(delta,picker=false){focusedCommandMove(delta,picker);if(state.exampleOpen){const list=picker?visiblePicker:visibleCommands,s=list[picker?state.pickerIndex:state.commandIndex];if(s){state.exampleId=s.id;state.exampleUid=null;renderExample();}}};
document.addEventListener('click',e=>{
 const remove=e.target.closest('[data-remove-step]'),stepExample=e.target.closest('[data-step-example]'),commandExample=e.target.closest('[data-command-example]'),menuExample=e.target.closest('[data-step-op=example]');
 if(remove){e.stopImmediatePropagation();operate('remove',Number(remove.dataset.removeStep));return;}

 if(commandExample){e.stopImmediatePropagation();openExample(commandExample.dataset.commandExample);return;}

},true);
