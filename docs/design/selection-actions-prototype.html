 case 'split':{const sep=o.separator==='custom'?o.custom:o.separator;if(!sep)throw Error('Enter a separator to split on.');return text.split(sep).join('\n');}
 case 'join':return lines(text).join(o.separator==='custom'?o.custom:o.separator);
 case 'sort':return lines(text).sort((a,b)=>o.direction==='desc'?(a<b?1:a>b?-1:0):(a<b?-1:a>b?1:0)).join('\n');
 case 'unique':{const seen=new Set;return lines(text).filter(t=>{const k=o.ignoreCase?t.toLocaleLowerCase():t;if(seen.has(k))return false;seen.add(k);return true;}).join('\n');}
 case 'trim':return lines(text).map(l=>l.trim()).join('\n');
 case 'empty':return lines(text).filter(l=>l.length).join('\n');
 case 'number':{const start=Number(o.start);if(!Number.isSafeInteger(start))throw Error('Enter a whole starting number.');return lines(text).map((l,i)=>`${start+i}. ${l}`).join('\n');}
 case 'bullet':return lines(text).map(l=>o.prefix+l).join('\n');
 case 'upper':return text.toLocaleUpperCase();case 'lower':return text.toLocaleLowerCase();
 case 'title':return text.toLocaleLowerCase().replace(/(^|\s)(\p{L})/gu,(m,a,b)=>a+b.toLocaleUpperCase());
 case 'replace':{if(!o.find)throw Error('Enter the text you want to find.');if(o.regex)return text.replace(new RegExp(o.find,o.matchCase?'g':'gi'),o.replacement);if(o.matchCase)return text.split(o.find).join(o.replacement);return text.replace(new RegExp(o.find.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),()=>o.replacement);}
 default:throw Error('Choose a supported action.');}}
function evaluate(){try{let text=state.source;for(const s of state.steps){text=apply(text,s);if(text.length>1000000)throw Error('This example is too large to preview.');}return{text,error:null};}catch(e){return{text:'',error:e.message};}}
function count(text){const n=lines(text).length;return !text?'':n>1?`${n} lines`:`${Array.from(text).length} characters`;}
function renderOptions(){const s=state.steps[state.active];const key=s?.id||'';if(key!==optionsKey){optionsKey=key;let html='';if(s){switch(s.id){
 case 'split':case 'join':html=`<label>${s.id==='split'?'Split on':'Join with'}<select data-option="separator" aria-label="Separator"><option value=", ">Comma + space</option><option value=",">Comma</option><option value=" ">Space</option><option value="\t">Tab</option><option value="custom">Custom…</option></select></label><label id="custom-separator-wrap" hidden><input class="small" data-option="custom" aria-label="Custom separator" placeholder="Separator"></label>`;break;
 case 'sort':html='<div class="toggle" role="group" aria-label="Sort order"><button data-direction="asc" aria-pressed="true">A → Z</button><button data-direction="desc" aria-pressed="false">Z → A</button></div>';break;
 case 'unique':html='<label class="check"><input type="checkbox" data-option="ignoreCase">Ignore case</label>';break;
 case 'number':html='<label>Start at<input type="number" class="small" data-option="start" aria-label="Starting number" step="1"></label>';break;
 case 'bullet':html='<label>Prefix<input class="small" data-option="prefix" aria-label="Line prefix"></label>';break;
 case 'replace':html='<label>Find<input data-option="find" aria-label="Find text" autocomplete="off"></label><label>Replace with<input data-option="replacement" aria-label="Replacement text" autocomplete="off"></label><label class="check"><input type="checkbox" data-option="matchCase">Match case</label><label class="check"><input type="checkbox" data-option="regex">Regex</label>';break;
 }}$('options').innerHTML=html;}
 $('options').hidden=!$('options').children.length;
 if(!s)return;
 for(const el of $('options').querySelectorAll('[data-option]')){const value=s.options[el.dataset.option];if(el.type==='checkbox')el.checked=!!value;else if(document.activeElement!==el)el.value=value??'';}
 const custom=$('custom-separator-wrap');if(custom)custom.hidden=s.options.separator!=='custom';
 for(const b of $('options').querySelectorAll('[data-direction]'))b.setAttribute('aria-pressed',String(s.options.direction===b.dataset.direction));
}
function menuItems(){const q=state.search.trim().toLocaleLowerCase();const built=ACTIONS.filter(a=>(a.label+' '+a.group).toLocaleLowerCase().includes(q)).map(a=>({...a,kind:'action'}));const recipes=[{name:'Clean a list',steps:cleanPipeline()},...state.cleaners].filter(r=>r.name.toLocaleLowerCase().includes(q)).map((r,i)=>({id:'cleaner-'+i,label:r.name,group:'Saved cleaners',icon:'◇',kind:'cleaner',recipe:r}));return [...recipes,...built];}
function renderCatalog(){visibleItems=menuItems();state.menuIndex=Math.max(0,Math.min(state.menuIndex,visibleItems.length-1));let group='';$('catalog-list').innerHTML=visibleItems.map((a,i)=>{let heading=a.group!==group?`<div class="menu-group" role="presentation">${escapeHtml(a.group)}</div>`:'';group=a.group;return heading+`<button class="catalog-item" id="action-option-${i}" role="option" aria-selected="${i===state.menuIndex}" data-item="${i}" tabindex="-1"><span class="item-icon" aria-hidden="true">${escapeHtml(a.icon)}</span><span>${escapeHtml(a.label)}</span>${a.kind==='action'&&state.steps.length===1&&state.steps[0].id===a.id?'<span class="item-check" aria-hidden="true">✓</span>':''}</button>`;}).join('')||'<div class="no-actions">No matching actions</div>';
 $('action-search').setAttribute('aria-activedescendant',visibleItems.length?'action-option-'+state.menuIndex:'');
}
function renderCompose(){$('compose').hidden=!state.compose;$('compose').innerHTML=state.steps.map((s,i)=>`${i?'<span class="step-separator" aria-hidden="true">→</span>':''}<span class="step" draggable="true" data-drag-step="${i}"><button data-step="${i}" aria-label="Configure ${escapeHtml(definition(s.id).label)}" aria-pressed="${i===state.active}">${escapeHtml(definition(s.id).label)}</button><button class="remove-step" data-remove-step="${i}" aria-label="Remove ${escapeHtml(definition(s.id).label)}">×</button></span>`).join('')+'<button class="add-step" id="add-step">+ Add action</button>';$('combine-button').textContent=state.compose?'Done combining':'Combine actions';$('menu-combine').textContent=state.compose?'Finish combining':'Combine actions';}
function renderPreview(){document.body.dataset.appearance=state.appearance;document.body.dataset.layout=state.layout;document.documentElement.style.setProperty('--font-size',state.fontSize+'px');$('font-value').textContent=state.fontSize+' px';$('font-size').value=state.fontSize;$('appearance').value=state.appearance;$('layout').value=state.layout;$('workbench').dataset.selection=String(state.mode==='selection');
 computed=evaluate();if($('before').value!==state.source)$('before').value=state.source;
 const hasAction=state.steps.length>0;const text=hasAction?computed.text:'';$('after').textContent=text;
 $('empty-result').hidden=!!text;$('empty-result').textContent=!hasAction?'Choose an action to preview':computed.error?'': 'Empty result';
 $('before-count').textContent=count(state.source);$('after-count').textContent=count(text);
 $('error').textContent=computed.error||'';$('error').hidden=!computed.error;
 $('copy-result').disabled=!hasAction||!!computed.error;$('replace-result').disabled=!hasAction||!!computed.error;
 $('action-title').textContent=state.cleanerName||(state.steps.length===1?definition(state.steps[0].id).label:'Transform text');
 renderOptions();renderCompose();
 const catalogOpen=state.menu==='catalog';const moreOpen=state.menu==='more';$('catalog').hidden=!catalogOpen;$('more-menu').hidden=!moreOpen;$('scrim').hidden=!(catalogOpen||moreOpen);$('action-switch').setAttribute('aria-expanded',String(catalogOpen));$('action-search').setAttribute('aria-expanded',String(catalogOpen));$('more-button').setAttribute('aria-expanded',String(moreOpen));$('menu-save').disabled=!hasAction;if(catalogOpen)renderCatalog();
 $('save-backdrop').hidden=!state.saveOpen;$('toast').hidden=!state.toast;$('toast-text').textContent=state.toast;$('undo').hidden=!state.toastUndo;
 for(const el of document.querySelectorAll('[data-preset]'))el.setAttribute('aria-pressed',String(el.dataset.preset===state.preset));
 if($('selection-source').value!==state.doc)$('selection-source').value=state.doc;$('selection-bar').hidden=!state.barVisible;document.querySelector('.selection-help').hidden=state.barVisible;
 if(state.mode==='selection'&&state.barVisible){const ta=$('selection-source');const line=state.doc.slice(0,state.selection.start).split('\n').length-1;const lh=parseFloat(getComputedStyle(ta).lineHeight);const y=ta.offsetTop+parseFloat(getComputedStyle(ta).paddingTop)+line*lh-ta.scrollTop-43;$('selection-bar').style.top=Math.max(45,Math.min(y,$('writing-app').clientHeight-46))+'px';}
}
function updatePrompt(){let brief='Design Magpie’s text actions around large, equally sized Before and After previews. Keep one action active by default. Reveal the searchable action picker, combining controls and saved-cleaner tools only when requested. Use a compact selection bar with plain text actions, a quiet Copy control and one clear Replace action. Preserve the user’s text until they explicitly replace it.';if(state.fontSize!==DEFAULTS.fontSize)brief+=` Use ${state.fontSize}px preview text for ${state.fontSize>22?'more prominent':'more compact'} reading.`;if(state.appearance!==DEFAULTS.appearance)brief+=' Use a light appearance with subtle dividers.';if(state.layout!==DEFAULTS.layout)brief+=' Stack Before above After instead of showing them side by side.';$('design-brief').textContent=brief;}
function updateAll(){renderPreview();updatePrompt();}
function notify(text,undo=false){clearTimeout(toastTimer);state.toast=text;state.toastUndo=undo;updateAll();toastTimer=setTimeout(()=>{state.toast='';state.toastUndo=false;updateAll();},undo?9000:2300);}
function openMenu(which){state.menu=state.menu===which?null:which;state.search='';state.menuIndex=0;$('action-search').value='';updateAll();if(state.menu==='catalog')$('action-search').focus();}
function pick(item){if(!item)return;if(item.kind==='cleaner'){state.steps=structuredClone(item.recipe.steps);state.active=0;state.cleanerName=item.label;state.compose=false;}else{const s=step(item.id);if(state.compose){if(state.steps.length>=20){notify('Use up to 20 actions in this prototype.');return;}state.steps.push(s);state.active=state.steps.length-1;}else{state.steps=[s];state.active=0;}state.cleanerName='';}state.menu=null;optionsKey='';updateAll();$('action-switch').focus();}
function setPreset(name){Object.assign(state,structuredClone(DEFAULTS),{preset:name,mode:'editor',source:'pear, apple, pear, banana',steps:[step('split')],active:0,compose:false,cleanerName:'',origin:'example',doc:SAMPLE_DOC,menu:null,search:'',menuIndex:0,saveOpen:false,undo:null,toast:'',toastUndo:false,barVisible:true});if(name==='sort'){state.source='pear\napple\npear\nbanana';state.steps=[step('sort')];}if(name==='clean'){state.source=' pear\napple\n\npear\n banana ';state.steps=cleanPipeline();state.cleanerName='Clean a list';}if(name==='selection'){state.mode='selection';state.steps=[];const start=state.doc.indexOf('pear');state.selection={start,end:start+'pear, apple, pear, banana'.length};}optionsKey='';updateAll();if(name==='selection'){const ta=$('selection-source');ta.focus();ta.setSelectionRange(state.selection.start,state.selection.end);}}
function openSelected(action){const{start,end}=state.selection;const selected=state.doc.slice(start,end);if(!selected)return;state.source=selected;state.origin='selection';state.originText=selected;state.originDoc=state.doc;state.mode='editor';state.steps=action==='transform'?[]:[step(action)];state.active=0;state.compose=false;state.cleanerName='';state.menu=action==='transform'?'catalog':null;state.search='';state.menuIndex=0;optionsKey='';$('action-search').value='';updateAll();if(state.menu)$('action-search').focus();}
function replaceResult(){if(!state.steps.length||computed.error)return;state.undo={source:state.source,doc:state.doc,selection:structuredClone(state.selection),mode:state.mode,origin:state.origin};if(state.origin==='selection'){if(state.doc!==state.originDoc||state.doc.slice(state.selection.start,state.selection.end)!==state.originText){state.undo=null;notify('The selection changed. Select the text again.');return;}const start=state.selection.start;state.doc=state.doc.slice(0,start)+computed.text+state.doc.slice(state.selection.end);state.selection={start,end:start+computed.text.length};state.mode='selection';state.barVisible=false;notify('Selection replaced',true);}else{state.source=computed.text;notify('Example replaced',true);}updateAll();}
async function copyText(text){if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);return;}catch{}}const el=document.createElement('textarea');el.value=text;el.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(el);el.select();const ok=document.execCommand('copy');el.remove();if(!ok)throw Error('Select the text and copy it with your keyboard.');}
async function copyResult(){if(!state.steps.length||computed.error)return;try{await copyText(computed.text);notify('Copied');}catch(e){notify(e.message);}}
$('before').addEventListener('input',e=>{state.source=e.target.value;state.undo=null;updateAll();});
$('action-switch').addEventListener('click',()=>openMenu('catalog'));$('more-button').addEventListener('click',()=>openMenu('more'));$('scrim').addEventListener('click',()=>{state.menu=null;updateAll();});
$('action-search').addEventListener('input',e=>{state.search=e.target.value;state.menuIndex=0;updateAll();});$('catalog-list').addEventListener('click',e=>{const b=e.target.closest('[data-item]');if(b)pick(visibleItems[Number(b.dataset.item)]);});
$('options').addEventListener('input',e=>{const s=state.steps[state.active];if(!s||!e.target.dataset.option)return;s.options[e.target.dataset.option]=e.target.type==='checkbox'?e.target.checked:e.target.value;state.cleanerName='';updateAll();});
$('options').addEventListener('click',e=>{const b=e.target.closest('[data-direction]');if(b){state.steps[state.active].options.direction=b.dataset.direction;state.cleanerName='';updateAll();}});
$('combine-button').addEventListener('click',()=>{state.compose=!state.compose;updateAll();});$('menu-combine').addEventListener('click',()=>{state.compose=!state.compose;state.menu=null;updateAll();});
$('compose').addEventListener('click',e=>{const rm=e.target.closest('[data-remove-step]');if(rm){state.steps.splice(Number(rm.dataset.removeStep),1);state.active=Math.max(0,Math.min(state.active,state.steps.length-1));state.cleanerName='';optionsKey='';updateAll();return;}const b=e.target.closest('[data-step]');if(b){state.active=Number(b.dataset.step);optionsKey='';updateAll();}if(e.target.closest('#add-step'))openMenu('catalog');});
$('compose').addEventListener('dragstart',e=>{const item=e.target.closest('[data-drag-step]');if(item){state.dragIndex=Number(item.dataset.dragStep);e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(state.dragIndex));}});$('compose').addEventListener('dragover',e=>e.preventDefault());$('compose').addEventListener('drop',e=>{e.preventDefault();const target=e.target.closest('[data-drag-step]');if(target&&state.dragIndex!==null){const i=Number(target.dataset.dragStep);const moved=state.steps.splice(state.dragIndex,1)[0];state.steps.splice(i,0,moved);state.active=i;state.cleanerName='';optionsKey='';updateAll();}state.dragIndex=null;});
$('copy-result').addEventListener('click',copyResult);$('replace-result').addEventListener('click',replaceResult);$('undo').addEventListener('click',()=>{if(!state.undo)return;Object.assign(state,state.undo);state.undo=null;if(state.origin==='selection')state.mode='selection';state.barVisible=state.mode==='selection';notify('Restored the original text');if(state.mode==='selection'){$('selection-source').focus();$('selection-source').setSelectionRange(state.selection.start,state.selection.end);}});
$('menu-reset').addEventListener('click',()=>setPreset(state.preset));$('back-to-selection').addEventListener('click',()=>setPreset('selection'));
$('menu-save').addEventListener('click',()=>{state.menu=null;state.saveOpen=true;$('cleaner-name').value=state.cleanerName;$('save-error').hidden=true;updateAll();$('cleaner-name').focus();});$('save-cancel').addEventListener('click',()=>{state.saveOpen=false;updateAll();});
$('save-form').addEventListener('submit',e=>{e.preventDefault();const name=$('cleaner-name').value.trim();if(!name){$('save-error').textContent='Give your cleaner a name.';$('save-error').hidden=false;return;}const recipe={name,steps:structuredClone(state.steps)};const existing=state.cleaners.findIndex(r=>r.name===name);if(existing<0)state.cleaners.push(recipe);else state.cleaners[existing]=recipe;try{localStorage.setItem('magpie-design-cleaners',JSON.stringify(state.cleaners));}catch{}state.cleanerName=name;state.saveOpen=false;notify('Cleaner saved in this prototype');});
$('selection-source').addEventListener('select',e=>{const ta=e.target;state.selection={start:ta.selectionStart,end:ta.selectionEnd};state.barVisible=ta.selectionEnd>ta.selectionStart;updateAll();});$('selection-source').addEventListener('input',e=>{state.doc=e.target.value;state.barVisible=false;updateAll();});$('selection-source').addEventListener('scroll',()=>{if(state.mode==='selection')renderPreview();});
$('selection-bar').addEventListener('mousedown',e=>e.preventDefault());$('selection-bar').addEventListener('click',async e=>{const b=e.target.closest('[data-selection-action]');if(!b)return;const id=b.dataset.selectionAction;if(id==='copy'){try{await copyText(state.doc.slice(state.selection.start,state.selection.end));state.barVisible=false;notify('Copied');}catch(err){notify(err.message);}}else openSelected(id);});
for(const b of document.querySelectorAll('[data-preset]'))b.addEventListener('click',()=>setPreset(b.dataset.preset));
$('font-size').addEventListener('input',e=>{state.fontSize=Number(e.target.value);updateAll();});$('appearance').addEventListener('change',e=>{state.appearance=e.target.value;updateAll();});$('layout').addEventListener('change',e=>{state.layout=e.target.value;updateAll();});$('copy-brief').addEventListener('click',async()=>{const b=$('copy-brief');try{await copyText($('design-brief').textContent);b.textContent='Copied';setTimeout(()=>b.textContent='Copy design brief',1800);}catch(e){b.textContent=e.message;}});
document.addEventListener('keydown',e=>{const primary=e.metaKey||e.ctrlKey;if(state.saveOpen){if(e.key==='Escape'){state.saveOpen=false;updateAll();e.preventDefault();}if(e.key==='Tab'){const els=[...$('save-form').querySelectorAll('input,button')];const index=els.indexOf(document.activeElement);if(e.shiftKey&&index===0){e.preventDefault();els.at(-1).focus();}else if(!e.shiftKey&&index===els.length-1){e.preventDefault();els[0].focus();}}return;}
 if(e.key==='Escape'){e.preventDefault();if(state.menu){state.menu=null;updateAll();$('action-switch').focus();}else if(state.mode==='editor'&&state.origin==='selection'){state.mode='selection';state.barVisible=true;updateAll();$('selection-source').focus();$('selection-source').setSelectionRange(state.selection.start,state.selection.end);}else{state.barVisible=false;updateAll();}return;}
 if(state.mode==='selection'&&state.barVisible&&e.ctrlKey&&e.shiftKey&&['1','2','3','4','5'].includes(e.code.replace('Digit',''))){e.preventDefault();const ids=['copy','sort','split','join','transform'];const index=Number(e.code.replace('Digit',''))-1;$('selection-bar').querySelector(`[data-selection-action="${ids[index]}"]`).click();return;}
 if(state.mode!=='editor')return;
 if(primary&&e.key.toLowerCase()==='k'){e.preventDefault();openMenu('catalog');return;}
 if(state.menu==='catalog'&&['ArrowDown','ArrowUp','Enter'].includes(e.key)){e.preventDefault();if(e.key==='Enter')pick(visibleItems[state.menuIndex]);else{state.menuIndex=Math.max(0,Math.min(visibleItems.length-1,state.menuIndex+(e.key==='ArrowDown'?1:-1)));updateAll();$('action-option-'+state.menuIndex)?.scrollIntoView({block:'nearest'});}return;}
 if(primary&&e.key==='Enter'){e.preventDefault();replaceResult();return;}
 const editable=document.activeElement?.matches('input,textarea,[contenteditable]');if(primary&&e.key.toLowerCase()==='c'&&!editable&&!window.getSelection()?.toString()){e.preventDefault();copyResult();}
});
updateAll();
</script>
