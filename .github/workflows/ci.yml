name: ci
on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.97.1, but the runner auto-installs it WITHOUT the
      # clippy/rustfmt components — install them explicitly. Keep the version in sync
      # with rust-toolchain.toml.
      - name: Install pinned Rust toolchain (+ clippy, rustfmt)
        run: rustup toolchain install 1.97.1 --profile minimal -c clippy -c rustfmt

      # System deps for arboard + Slint (winit/femtovg), tray-icon (GTK/glib +
      # ayatana appindicator), enigo (libxdo), notify-rust (D-Bus), plus a headless
      # X server so the Linux clipboard test can actually exercise instead of skipping.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev \
            libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libdbus-1-dev \
            xvfb xclip

      - name: Test (Linux, headless X)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace

      - name: Test (macOS / Windows)
        if: runner.os != 'Linux'
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rustfmt
        run: cargo fmt --all --check
