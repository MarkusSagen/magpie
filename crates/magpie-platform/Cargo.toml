[package]
name = "magpie-platform"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
magpie-core = { path = "../magpie-core" }
regex = "1"
blake3 = "1"
arboard = "3"
active-win-pos-rs = "0.8"
global-hotkey = "0.6"
enigo = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "ico", "tiff"] }

[dev-dependencies]
proptest = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSWorkspace", "NSRunningApplication", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData", "NSDictionary"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_System_DataExchange",
  "Win32_System_Registry",
  "Win32_Foundation",
] }
