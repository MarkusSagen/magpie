[package]
name = "magpie-platform"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
magpie-core = { path = "../magpie-core" }
regex = "1"
blake3 = "1"
getrandom = "0.2"
arboard = "3"
active-win-pos-rs = "0.8"
global-hotkey = "0.6"
enigo = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "ico", "tiff"] }

[dev-dependencies]
proptest = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSApplication", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData", "NSDictionary", "NSError"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotification", "UNNotificationResponse", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_System_DataExchange",
  "Win32_System_Registry",
  "Win32_Foundation",
  # app_icons.rs: SHGetFileInfoW (+ its SHFILEINFOW/FILE_FLAGS_AND_ATTRIBUTES
  # param) and the GDI icon->bitmap->DIB pipeline.
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
] }

# app_icons.rs: resolve an app's icon from the freedesktop icon theme.
[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons = "0.4"

# Cross-platform desktop notifications for non-macOS (Linux: zbus/D-Bus, pure Rust;
# Windows: WinRT toast). macOS uses UNUserNotificationCenter instead (see os/notify.rs).
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"
