[package]
name = "magpie-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "magpie"
path = "src/main.rs"

[dependencies]
magpie-core = { path = "../magpie-core" }
magpie-platform = { path = "../magpie-platform" }
slint = { version = "1.8", features = ["unstable-fontique-010"] }
tray-icon = "0.24"
global-hotkey = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
image = "0.25"
regex = "1"
ureq = "2"
serde_json = "1"
plist = "1"
# File search (Phase 15): ripgrep's libraries — `ignore` for the parallel walk +
# .gitignore/.ignore/global-excludes handling (supports custom ignore filenames),
# and grep-{searcher,regex,matcher} for content matching. No external rg/fd binary.
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
# Live project file sync (Phase 18b): filesystem-event watcher for the specific
# project task files (FSEvents/kqueue/inotify). Watched non-recursively per project
# dir, so it never crawls whole roots.
notify = "6"

[build-dependencies]
slint-build = "1.8"
